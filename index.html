<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kiểm Tra Tốc Độ Phản Xạ - Bài 38a</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding-top: 20px;
            transition: background-color 0.5s ease;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .control-panel {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-panel label {
            font-weight: bold;
        }
        .control-panel input {
            width: 70px;
            padding: 6px;
            font-size: 15px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }
        .btn-start { background-color: #28a745; }
        .btn-color { background-color: #17a2b8; }
        .btn-player { background-color: #6f42c1; }

        .info-panel {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #444;
        }
        .info-panel span {
            color: #d9534f;
            margin: 0 10px;
        }

        /* Khu vực chơi #arena */
        #arena {
            width: 600px;
            height: 400px;
            background-color: #222;
            border: 4px solid #444;
            border-radius: 10px;
            margin: 0 auto 20px auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: background-color 0.5s ease;
        }

        /* Mục tiêu hình tròn */
        .target {
            width: 40px;
            height: 40px;
            background-color: #ff4757;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 0 10px #ff4757;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Game Kiểm Tra Tốc Độ Phản Xạ (Nâng cấp)</h1>

    <!-- Bảng điều khiển & Các nút chức năng mới -->
    <div class="control-panel">
        <label for="custom-time">Thời gian chơi (giây):</label>
        <input type="number" id="custom-time" value="30" min="5" max="300">

        <button id="start-btn" class="btn-start" onclick="startGame()">Bắt đầu trò chơi</button>
        <button class="btn-color" onclick="changeBackgroundColor()">Đổi màu nền</button>
        <button class="btn-player" onclick="showPlayerInfo()">Người chơi</button>
    </div>

    <div class="info-panel">
        Điểm số: <span id="score">0</span> | 
        Thời gian còn lại: <span id="timer">30</span> giây
    </div>

    <!-- Khu vực chơi #arena -->
    <div id="arena">
        <div id="target" class="target"></div>
    </div>

    <script>
        // MÃ SỐ SINH VIÊN CỦA BẠN (Thay đổi ở đây nếu cần)
        const STUDENT_ID = "231A010021"; // Điền Mã Số Sinh Viên của bạn

        const arena = document.getElementById('arena');
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const customTimeInput = document.getElementById('custom-time');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let targetInterval = null;
        let isPlaying = false;

        // 1. Chức năng đổi màu nền ngẫu nhiên (đổi màu arena và body)
        function changeBackgroundColor() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            arena.style.backgroundColor = randomColor;
        }

        // 2. Chức năng hiển thị Mã số sinh viên khi bấm nút Người chơi
        function showPlayerInfo() {
            alert(`Thông tin người chơi:\nMã số sinh viên: ${STUDENT_ID}`);
        }

        // Di chuyển mục tiêu đến vị trí ngẫu nhiên
        function moveTarget() {
            const maxX = arena.clientWidth - target.clientWidth;
            const maxY = arena.clientHeight - target.clientHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
            target.style.display = 'block';
        }

        // Xử lý sự kiện click mục tiêu
        target.addEventListener('click', () => {
            if (!isPlaying) return;
            score++;
            scoreDisplay.textContent = score;
            moveTarget();
        });

        // 3. Chức năng bắt đầu trò chơi với thời gian đếm ngược tùy chọn
        function startGame() {
            // Lấy thời gian tùy chọn từ ô input
            const inputVal = parseInt(customTimeInput.value);
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Vui lòng nhập thời gian hợp lệ (lớn hơn 0 giây)!");
                return;
            }

            // Reset trạng thái
            score = 0;
            timeLeft = inputVal;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            
            startBtn.disabled = true;
            customTimeInput.disabled = true;
            isPlaying = true;

            moveTarget();

            // Đếm ngược thời gian
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Tự động đổi vị trí mỗi 1 giây
            targetInterval = setInterval(() => {
                if (isPlaying) {
                    moveTarget();
                }
            }, 1000);
        }

        // Kết thúc trò chơi & Khóa toàn bộ thao tác
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(targetInterval);
            
            target.style.display = 'none';
            startBtn.disabled = false;
            customTimeInput.disabled = false;

            alert(`HẾT GIỜ!\nTổng số điểm bạn đạt được là: ${score} điểm.`);
        }
    </script>
</body>
</html>
